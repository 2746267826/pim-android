name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_all:
        description: Force all builds
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      artifact_slug: ${{ steps.ver.outputs.artifact_slug }}
      assembly_version: ${{ steps.ver.outputs.assembly_version }}
      git_sha_short: ${{ steps.ver.outputs.git_sha_short }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
      is_release: ${{ steps.ver.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        uses: ./.github/actions/resolve-version
        with:
          pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}

  build-android:
    needs: [resolve-version]
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
    secrets: inherit

  build-shell-android:
    needs: [resolve-version]
    uses: ./.github/workflows/build-shell-android.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
    secrets: inherit

  # 契约新鲜度（只读 check + 离线行为测试）：把本仓 contract/openapi.json 与 pim-api 当前上游
  # 解析出的不可变 commit 上的同路径字节做**逐字节比较**，并校验 contract/provenance.json
  # 的存在性/形状及其与仓内快照的一致性。
  #
  # 上游契约一变、本仓没刷新 → 本 job 红；人工执行 scripts/ci/fetch-contract.sh 并提交刷新结果即恢复。
  # 取不到权威源（网络/404/空体/非 OpenAPI3）一律 fail-closed，不跳过、不降级。
  # 本仓没有 generated.ts / 没有 openapi-typescript 生成步骤，所以不安装 npm、不生成代码；
  # 入仓产物只有两个：contract/openapi.json 与 contract/provenance.json。
  #
  # 为什么是独立 job（而不是像 web 那样复用某个构建 job）：本仓的构建 job 是可复用 workflow
  # （build-android / build-shell-android），需要 Android SDK 且与契约无关；本校验只需要
  # Ubuntu + python3，独立成 job 才能被 CI Gate 逐个 check 消费而不必抬高构建成本。
  # 无 if: / continue-on-error / 路径过滤：push(master)、pull_request、workflow_dispatch 都执行。
  contract-freshness:
    name: Contract freshness
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 显式准备本设施的必要前置：python3（payload/provenance JSON 校验）与 PyYAML
      # （行为测试从真实 ci.yml 原样抽取 step/gate 体）。不依赖 runner 的预装版本。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test prerequisites (PyYAML)
        run: python3 -m pip install --disable-pip-version-check PyYAML

      # 先跑目标行为测试（离线 fixture 上游；证明一致=绿/陈旧=红/取源失败=红/旁路被拒）
      - name: Contract freshness behaviour tests
        run: |
          set -euo pipefail
          bash scripts/ci/test-contract-freshness.sh

      # 再跑默认真实上游的只读 check（不带任何 PIM_CONTRACT_* 覆盖）
      - name: Verify client contract is up to date
        run: |
          set -euo pipefail
          bash scripts/ci/check-contract-freshness.sh
          echo "✅ 契约快照与 provenance 均与 pim-api 当前上游一致"

  # 契约生成物一致性（只读 check + 离线行为测试）：用仓内 contract/openapi.json
  # 重新生成一次 Kotlin DTO，与随提交进仓的
  # core/src/main/java/com/pim/core/contract/ContractModels.kt 做**逐字节比较**。
  #
  # 为什么必须独立成 job：契约新鲜度只证明「快照字节没落后」，不证明「客户端 DTO 跟得上契约」。
  # 契约改了、生成物没重新生成（或有人手工改了生成物）→ 本 job 红；
  # 人工执行 scripts/ci/generate-contract-kotlin.sh 并提交即恢复。
  # 生成器只用 python3 标准库：离线、确定性、不装 npm/不跑 gradle。
  #
  # 与编译期门禁 `verifyContractEndpoints`（gradle，挂在 :core/:app/:features:calendar 的
  # 编译任务之前，校验端点/路径参数/查询参数）分工：这里管「DTO 生成物与契约一致」，
  # 那里管「代码里写的端点/参数确实在契约里」。两者都进 CI Gate。
  contract-codegen:
    name: Contract codegen freshness
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyYAML 只给行为测试解析真实 ci.yml 的结构用（生成器本身只用标准库）。
      - name: Install test prerequisites (PyYAML)
        run: python3 -m pip install --disable-pip-version-check PyYAML

      # 先跑目标行为测试（离线 fixture；证明一致=绿 / 手工改动=红 / 契约变了没重生成=红 /
      # 生成物缺失=红 / 清单里编造端点=生成器拒绝 / CI 必需检查链接线正确）
      - name: Contract codegen behaviour tests
        run: |
          set -euo pipefail
          bash scripts/ci/test-contract-kotlin.sh

      # 再跑真实只读 check：重新生成到仓外临时目录，与仓内生成物逐字节比对
      - name: Verify generated Kotlin DTOs match the contract snapshot
        run: |
          set -euo pipefail
          bash scripts/ci/check-contract-kotlin.sh
          echo "✅ 生成物与 contract/openapi.json 逐字节一致"

  # 汇总门禁：任一子任务失败即整体失败，避免"看起来绿了"。
  gate:
    name: CI Gate
    needs: [resolve-version, build-android, build-shell-android, contract-freshness, contract-codegen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        env:
          R_RESOLVE: ${{ needs.resolve-version.result }}
          R_APK: ${{ needs.build-android.result }}
          R_SHELL: ${{ needs.build-shell-android.result }}
          R_FRESHNESS: ${{ needs.contract-freshness.result }}
          R_CODEGEN: ${{ needs.contract-codegen.result }}
        run: |
          set -uo pipefail
          fail=0
          check () {
            local label="$1" result="$2"
            if [ "$result" = "success" ]; then
              echo "✅ $label — success"
            else
              echo "❌ $label — ${result:-<missing>}"
              fail=1
            fi
          }
          check "resolve-version" "$R_RESOLVE"
          check "build-android" "$R_APK"
          check "build-shell-android" "$R_SHELL"
          check "contract-freshness" "$R_FRESHNESS"
          check "contract-codegen" "$R_CODEGEN"

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "::error::CI Gate 未通过：存在失败或未产生结果的必需 job。"
            exit 1
          fi
          echo ""
          echo "CI Gate 通过：所有必需 job 均成功。"

  # 发版：打 tag（v2026.10.810）时发布安装包 + version.json。
  # version.json 是客户端更新检查的唯一数据源，读取用 release 的稳定直链：
  #   https://github.com/<owner>/<repo>/releases/latest/download/version.json
  # 走直链不需要 GitHub API/token，也不受 master 门禁约束（不往受保护分支提交）。
  release:
    # 合并到 master 就发版（与 pim-api 一致）。原先写成 tag 触发，但拆仓后
    # 「每次合并 = 一个版本」是既定口径，tag 由 gh release create 自动创建。
    # 构建失败时不发版；PR 时 is_release 为 false，自然跳过。
    # contract-freshness / contract-codegen 也必须在 needs 里：否则 master 上的 release 只依赖两个构建 job，
    # 会在契约快照或生成物对不上时照样发版（绕过这两道 check）。
    if: |
      always() &&
      needs.resolve-version.outputs.is_release == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: [resolve-version, build-android, build-shell-android, contract-freshness, contract-codegen]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Normalize assets and generate version.json
        run: |
          set -euo pipefail
          V="${{ needs.resolve-version.outputs.version }}"
          VC="${{ needs.resolve-version.outputs.version_code }}"
          TAG="${{ needs.resolve-version.outputs.release_tag }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          mkdir -p out
          APK="$(ls dl/pim-android-*/*.apk | head -n1)"
          cp "$APK" "out/pim-android-v$V.apk"
          SHELL_APK="$(ls dl/pim-shell-android-*/*.apk | head -n1)"
          cp "$SHELL_APK" "out/pim-shell-android-v$V.apk"
          jq -n \
            --arg v "$V" --arg vc "$VC" --arg base "$BASE" \
            --arg a "pim-android-v$V.apk" --arg s "pim-shell-android-v$V.apk" \
            '{version: $v, versionCode: ($vc|tonumber), releasedAt: (now|todateiso8601),
              assets: {
                android:      {version: $v, url: ($base + "/" + $a)},
                shellAndroid: {version: $v, url: ($base + "/" + $s)}
              }}' > out/version.json
          cat out/version.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 每个 step 是独立进程：上一步定义的 shell 变量不会带过来，
          # 这里用到的 TAG 必须在本步重新声明（此前漏了 -> TAG: unbound variable）。
          V="${{ needs.resolve-version.outputs.version }}"
          TAG="${{ needs.resolve-version.outputs.release_tag }}"
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "PIM Android $TAG" \
            --generate-notes

      - name: Summary
        if: always()
        run: |
          {
            echo "### 发版 ${{ needs.resolve-version.outputs.release_tag }}"
            echo ""
            echo "| 资产 | 说明 |"
            echo "| --- | --- |"
            echo "| pim-android-v${{ needs.resolve-version.outputs.version }}.apk | 安卓客户端 |"
            echo "| pim-shell-android-v${{ needs.resolve-version.outputs.version }}.apk | 安卓壳 |"
            echo "| version.json | 更新检查数据源 |"
          } >> "$GITHUB_STEP_SUMMARY"

