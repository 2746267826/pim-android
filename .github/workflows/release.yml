name: Release (promote)

# 正式版发布（手动 / 外部 agent 触发）—— 安卓客户端。
#
# 这个 workflow 只做一件事：把「带着新版本号的那次构建」提升成正式版。
#
#   1. 校验版本号（x.y.z；正常模式必须大于 master 上 VERSION，恢复模式必须
#      等于 master 上 VERSION）与发行说明
#      （说明必须引用真实并已合并的 PR —— 防编造，见 scripts/ci/validate-release-notes.sh）
#   2. 开一条只改 VERSION 的 PR，然后自动合并（PR 门禁照走，不绕过保护）
#   3. 等这次 master 构建跑完 —— 它按常规发出一条 pre-release（带全部资产）
#   4. 在共享发布锁内重新校验来源，再把那条 pre-release 改判为正式版
#
# 为什么不在本 workflow 里重新构建：正式版必须是「已经过完 CI 的那次构建」。
# 二次构建会得到另一个产物，等于发了一个没被测过的包。pre-release 里的资产
# 就是那次构建的产物，直接提升即可。
#
# 为什么拆成 prepare / apply 两个 job：prepare 要等 PR 合并和 master 构建，
# 可能长达数小时，不能一直持有发布锁；否则 ci.yml 的 release job 永远拿不到锁，
# 等待中的 pre-release 发不出来（死锁）。只有最后几秒的 apply 作业进入
# concurrency group `pim-release-mutation`，与 ci.yml 的 release job 串行。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version, e.g. 1.1.0 (normal mode: greater than VERSION on master; promote_tag mode: equal to it)'
        required: true
        type: string
      notes:
        description: 'Human-readable release notes (markdown; must reference merged PRs like (#123))'
        required: true
        type: string
      promote_tag:
        description: 'Resume only: promote an existing pre-release tag as-is (skips bump/PR/build wait)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

# 同一时间只跑一条 release 流程。注意这不是与 ci.yml 共享的发布锁：
# 这里要等数小时，真正的短锁在 apply job 上。
concurrency:
  group: release-promote
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.selected.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 用 PAT 而不是 GITHUB_TOKEN：GITHUB_TOKEN 触发的 push / pull_request
          # 不会启动任何 workflow，那样 bump PR 永远等不到 CI Gate、合并后的
          # master 构建也不会跑。PAT（或 GitHub App 令牌）被当作真实用户，才会触发。
          token: ${{ secrets.PIM_RELEASE_TOKEN || github.token }}

      - name: Preconditions
        env:
          RELEASE_TOKEN: ${{ secrets.PIM_RELEASE_TOKEN }}
          VERSION_INPUT: ${{ inputs.version }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: |
          set -euo pipefail
          # 这个 workflow 会改 VERSION、开 PR、把 tag 指到 latest。workflow_dispatch
          # 允许从任意分支/ref 触发，必须先把入口钉在 master，避免从旧分支提升。
          if [[ "${GITHUB_REF:-}" != "refs/heads/master" ]]; then
            echo "::error::release.yml 只能基于 master 触发（当前 ref=${GITHUB_REF:-<empty>}）"
            exit 1
          fi

          if ! [[ "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号必须是 x.y.z（收到 '${VERSION_INPUT}'）"
            exit 1
          fi
          CURRENT="$(head -n 1 VERSION | tr -d '\r' | tr -d '[:space:]')"

          if [[ -n "$PROMOTE_TAG" ]]; then
            if [[ ! "$PROMOTE_TAG" =~ ^[a-z0-9-]+-v[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
              echo "::error::promote_tag 格式不对（收到 '${PROMOTE_TAG}'，应形如 android-v26.11.1042）"
              exit 1
            fi
            if [[ "$VERSION_INPUT" != "$CURRENT" ]]; then
              echo "::error::恢复模式下 master 上的 VERSION 已是 '${CURRENT}'，不是目标 '${VERSION_INPUT}'。"
              echo "::error::先把 VERSION bump 合并进 master，或换用正常发版模式；不允许把旧版 tag 提升成 latest。"
              exit 1
            fi
            echo "恢复模式：校验通过后只提升已存在的 pre-release ${PROMOTE_TAG}（不改版本号、不等构建）"
            exit 0
          fi

          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error::缺少 secret PIM_RELEASE_TOKEN：改版本号要开 PR 并自动合并，必须有一个能触发 workflow 的令牌。"
            echo "::error::GITHUB_TOKEN 触发的 push/pull_request 不会启动 workflow，PR 永远等不到 CI Gate。"
            echo "::error::请创建 fine-grained PAT（仅本仓：Contents=RW、Pull requests=RW、Actions=R）或 GitHub App 令牌，存为 secret PIM_RELEASE_TOKEN 后重跑。"
            exit 1
          fi

          if [[ "$VERSION_INPUT" == "$CURRENT" ]]; then
            echo "::error::版本号没变（master 上已是 ${CURRENT}）；要发新版请改成一个更大的号"
            exit 1
          fi
          HIGHEST="$(printf '%s\n%s\n' "$CURRENT" "$VERSION_INPUT" | sort -V | tail -n 1)"
          if [[ "$HIGHEST" != "$VERSION_INPUT" ]]; then
            echo "::error::版本号必须大于 master 上的 ${CURRENT}（收到 ${VERSION_INPUT}）"
            exit 1
          fi
          echo "版本号检查通过：${CURRENT} → ${VERSION_INPUT}"

      - name: Validate release notes
        env:
          GH_TOKEN: ${{ secrets.PIM_RELEASE_TOKEN || github.token }}
          NOTES: ${{ inputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          bash scripts/ci/validate-release-notes.sh --file "$RUNNER_TEMP/notes.md" --repo "$REPO"
          echo "说明长度：$(wc -c < "$RUNNER_TEMP/notes.md") 字节"

      # ── 改版本号：开 PR → 自动合并 → 拿到合并提交 ──────────────────────
      - name: Bump VERSION and merge the PR
        id: bump
        if: inputs.promote_tag == ''
        env:
          GH_TOKEN: ${{ secrets.PIM_RELEASE_TOKEN }}
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/v${V}"
          git config user.name "pim-release-bot"
          git config user.email "pim-release-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          printf '%s\n' "$V" > VERSION
          git add VERSION
          git commit -m "chore(release): v${V} / 正式版 v${V}"
          # 重跑时分支可能已经在远端：这是一条一次性的发版分支，允许直接覆盖。
          # （master 上仍然绝不强推，这里是 release/vX.Y.Z。）
          git push -u origin "$BRANCH" || git push -u origin "$BRANCH" --force

          PR_NUM="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          # PR 正文保持仓内约定的四双语小节 + 需求验收映射，发布说明抽取脚本
          # 按这些小节取内容。已有 PR 也重写一次，避免旧模板缺章节。
          {
            echo "## 技术修改 / Technical changes"
            echo ""
            echo "- Bump \`VERSION\` to \`${V}\` (display version only; Android machine version stays CalVer + historical offset)."
            echo "- 只改显示版本号文件；机器版本（CalVer + versionCode）与更新检查逻辑不变。"
            echo ""
            echo "## 功能变化 / Feature changes"
            echo ""
            echo "- App 设置页与版本行显示 v${V}（括号里仍是机器号）。"
            echo "- 正式版仍由 release workflow 把本次构建提升上来，不二次构建。"
            echo ""
            echo "## 如何体验 / How to try it"
            echo ""
            echo "- 合并后打开 App →「设置」页底部：显示版本为 v${V}，括号内是机器版本。"
            echo "- 打开仓库 Releases：本次构建先是 Pre-release；提升成功后变为正式版并成为 latest。"
            echo "- 只有正式版参与客户端更新检查；开发期的 pre-release 不会被提示为更新。"
            echo ""
            echo "## 测试 / Tests"
            echo ""
            echo "- 本 PR 由 CI 在 PR 与合并提交上执行；结果以对应 CI run 日志为准。"
            echo "- 构建与资产：\`build-android\` / \`build-shell-android\` / \`contract-freshness\` / \`contract-codegen\`。"
            echo "- 正式版提升：NOT-VERIFIED（由 \`release.yml\` 实际运行后产生证据，本 PR 创建时尚不可知）。"
            echo ""
            echo "## 需求与验收映射 / Requirement & Acceptance Mapping"
            echo ""
            echo "| 需求 / Requirement | 验收标准 / Acceptance criteria | 证据 / Evidence | 状态 / Status |"
            echo "| --- | --- | --- | --- |"
            echo "| 显示版本 bump 到 v${V} | 仓根 \`VERSION\` 为 \`${V}\` | 本 PR 的 \`VERSION\` diff | PASS（由 release workflow 写入） |"
            echo "| APK 带上 v${V} 显示版本 | 构建产物设置 \`CI_DISPLAY_VERSION=${V}\` | 合并后 CI \`build-android\` / \`build-shell-android\` | NOT-VERIFIED（要等本 PR 的 CI） |"
            echo "| release 资产绑定 tag/commit/run | \`version.json\` 的 tag/gitSha/runId 与本次构建一致 | CI \`release\` 的 Prepare / Verify published release | NOT-VERIFIED（要等本 PR 的 CI） |"
            echo "| 正式版提升为 v${V} | pre-release 变为正式版并成为 latest，且不回退旧 CalVer | \`release.yml\` 的 Validate promote target + Promote | NOT-VERIFIED（尚未实际运行 release） |"
            echo "| 旧 CI 重跑不降级 | 正式版保持 formal；过期 run 不补发/刷新 release | CI \`release-publish-guard.sh\` + 共享 \`pim-release-mutation\` 锁 | NOT-VERIFIED（需真实重跑验证） |"
            echo ""
            echo "---"
            echo ""
            echo "由 release workflow 自动创建；合并后会把该次构建提升为正式版。"
          } > "$RUNNER_TEMP/pr-body.md"

          if [[ -n "$PR_NUM" ]]; then
            echo "复用已存在的 PR #${PR_NUM}"
            gh pr edit "$PR_NUM" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            PR_URL="$(gh pr create --base master --head "$BRANCH" \
              --title "chore(release): v${V} / 正式版 v${V}" \
              --body-file "$RUNNER_TEMP/pr-body.md")"
            PR_NUM="${PR_URL##*/}"
          fi
          echo "PR: https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUM}"
          echo "pr=$PR_NUM" >> "$GITHUB_OUTPUT"

          HEAD_SHA="$(git rev-parse HEAD)"
          # 不把 `gh pr merge --auto || true` 当成成功：未启用 auto-merge 时
          # 立即失败；只有 GitHub 回报 MERGED 且 merge commit 的 VERSION 正确
          # 才算完成。
          bash scripts/ci/merge-release-pr.sh \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUM" \
            --sha "$HEAD_SHA" \
            --version "$V"

      # ── 等那次 master 构建跑完（它按常规发出 pre-release） ─────────────
      - name: Wait for the master build of the merge commit
        id: build
        if: inputs.promote_tag == ''
        env:
          GH_TOKEN: ${{ secrets.PIM_RELEASE_TOKEN }}
          SHA: ${{ steps.bump.outputs.merge_sha }}
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 7200 ))
          RUN_ID=""
          RUN_NUMBER=""
          while true; do
            RUNS_JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$SHA" --limit 50 \
              --json databaseId,event,headBranch,headSha,status,conclusion,number)" \
              || { echo "无法读取 ${SHA} 的 CI run"; exit 1; }
            RUN_JSON="$(jq -c --arg sha "$SHA" \
              '[.[] | select(.event == "push" and .headBranch == "master" and .headSha == $sha)]
               | sort_by(.number) | last // empty' <<<"$RUNS_JSON")"
            if [[ -n "$RUN_JSON" && "$RUN_JSON" != "null" ]]; then
              RUN_ID="$(jq -r '.databaseId' <<<"$RUN_JSON")"
              RUN_NUMBER="$(jq -r '.number' <<<"$RUN_JSON")"
              RUN_DETAIL="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --json databaseId,event,headBranch,headSha,number,status,conclusion)" \
                || { echo "无法读取 run ${RUN_ID} 详情"; exit 1; }
              [[ "$(jq -r '.headSha // empty' <<<"$RUN_DETAIL")" == "$SHA" ]] \
                || { echo "::error::run ${RUN_ID} 的 headSha 不是合并提交 ${SHA}"; exit 1; }
              [[ "$(jq -r '.event // empty' <<<"$RUN_DETAIL")" == "push" ]] \
                || { echo "::error::run ${RUN_ID} 不是 push 构建"; exit 1; }
              [[ "$(jq -r '.headBranch // empty' <<<"$RUN_DETAIL")" == "master" ]] \
                || { echo "::error::run ${RUN_ID} 不是 master 分支构建"; exit 1; }
              STATUS="$(jq -r '.status // empty' <<<"$RUN_DETAIL")"
              CONCLUSION="$(jq -r '.conclusion // empty' <<<"$RUN_DETAIL")"
              echo "构建 run ${RUN_ID}: status=${STATUS} conclusion=${CONCLUSION}"
              if [[ "$STATUS" == "completed" ]]; then
                if [[ "$CONCLUSION" != "success" ]]; then
                  YM="$(gh run view "$RUN_ID" --json createdAt --jq '.createdAt' | cut -c1-7)"
                  EXPECTED_TAG="android-v${YM:2:2}.${YM:5:2}.$(( 10#${RUN_NUMBER} + 1000 ))"
                  echo "::error::合并提交的构建失败（conclusion=${CONCLUSION}）：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
                  echo "::error::PR 已经合并（版本号已改成新号），但没能产出可提升的构建。"
                  echo "::error::处理：把上面这次 run 里失败的 job 重跑成功后，再执行 gh workflow run release.yml -f promote_tag=${EXPECTED_TAG} -f version=<版本号> -f notes=<说明> 完成提升。"
                  exit 1
                fi
                break
              fi
            else
              echo "还没看到 ${SHA} 上的 master push 构建，继续等…"
            fi
            if (( $(date +%s) > DEADLINE )); then
              echo "::error::等待合并提交 ${SHA} 的构建超时（2 小时）"
              echo "::error::去这里看：https://github.com/${GITHUB_REPOSITORY}/actions?query=branch%3Amaster"
              exit 1
            fi
            sleep 30
          done
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # ── 找到这次构建发出的 pre-release ────────────────────────────────
      - name: Locate the pre-release built from that commit
        id: rel
        if: inputs.promote_tag == ''
        env:
          GH_TOKEN: ${{ secrets.PIM_RELEASE_TOKEN }}
          SHA: ${{ steps.bump.outputs.merge_sha }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
          RUN_NUMBER: ${{ steps.build.outputs.run_number }}
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 900 ))
          TAG=""
          while true; do
            RELEASES_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")" \
              || { echo "无法读取 release 列表"; exit 1; }
            TAG="$(jq -r --arg sha "$SHA" \
              '[.[] | select(.target_commitish == $sha and .prerelease == true) | .tag_name][0] // empty' \
              <<<"$RELEASES_JSON")"
            if [[ -z "$TAG" ]]; then
              TAG="$(jq -r --arg sha "$SHA" \
                '[.[] | select(.target_commitish == $sha) | .tag_name][0] // empty' \
                <<<"$RELEASES_JSON")"
            fi
            if [[ -n "$TAG" ]]; then break; fi
            if (( $(date +%s) > DEADLINE )); then break; fi
            echo "构建已完成但 release 还没出现，继续等…"
            sleep 20
          done
          if [[ -z "$TAG" ]]; then
            # 兜底：按 run 号推 tag（ci.yml 用 GITHUB_RUN_NUMBER + 1000 生成）
            YM="$(gh run view "$RUN_ID" --json createdAt --jq '.createdAt' | cut -c1-7)"
            TAG="android-v${YM:2:2}.${YM:5:2}.$(( 10#${RUN_NUMBER} + 1000 ))"
            echo "::warning::按合并提交没找到 release，改用 run 号推断 tag=${TAG}"
          fi
          if [[ ! "$TAG" =~ ^android-v[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::找到的 release tag '${TAG}' 不符合 android-vYY.MM.N 格式"
            exit 1
          fi
          EXPECTED_N=$(( 10#${RUN_NUMBER} + 1000 ))
          TAG_N="${TAG##*.}"
          if (( 10#$TAG_N != EXPECTED_N )); then
            echo "::error::release tag ${TAG} 的机器序号 ${TAG_N} 与 run ${RUN_NUMBER} + 1000 不一致"
            exit 1
          fi
          if ! REL_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json tagName,targetCommitish,isPrerelease,isDraft)"; then
            echo "::error::找不到可提升的 release（tag=${TAG}）。构建成功却没发版，去 CI run 里看 release job 日志：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
            exit 1
          fi
          [[ "$(jq -r '.targetCommitish // empty' <<<"$REL_JSON")" == "$SHA" ]] \
            || { echo "::error::release ${TAG} 的 targetCommitish 不是 ${SHA}"; exit 1; }
          [[ "$(jq -r 'if has("isDraft") then .isDraft else "missing" end' <<<"$REL_JSON")" == "false" ]] \
            || { echo "::error::release ${TAG} 是 draft"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "待提升的 release：${TAG}（commit ${SHA}）"

      - name: Select promote tag
        id: selected
        env:
          PROMOTE_TAG: ${{ inputs.promote_tag }}
          DISCOVERED_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$PROMOTE_TAG" ]]; then
            TAG="$PROMOTE_TAG"
          else
            TAG="$DISCOVERED_TAG"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::没有可提升的 tag（正常路径没找到构建产物 release，promote_tag 也为空）"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^[a-z0-9-]+-v[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::promote tag 格式不对：'${TAG}'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apply 阶段将提升：${TAG}"

  # ── 短锁内的最终校验 + 提升 ────────────────────────────────────────────
  # prepare 可能等几小时，不能占用发布锁；apply 只做最后一步，先同步到当前
  # master，再重新做来源校验。ci.yml 的 release job 使用同一个 concurrency
  # group，因此不会出现「刚提升完又被旧 CI 重跑改回 pre-release」的竞态。
  apply:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pim-release-mutation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PIM_RELEASE_TOKEN || github.token }}

      # workflow_dispatch 的 checkout 是触发时的 master；bump PR 合并后
      # tag 的 squash commit 是它的后代。必须同步到当前 master，否则
      # 「tag commit 在当前历史里」会把正常发版误判成失败。
      - name: Sync to current master
        run: |
          set -euo pipefail
          git fetch --prune origin master
          git checkout -B master origin/master
          echo "validate HEAD: $(git rev-parse HEAD)"
          echo "master VERSION: $(head -n 1 VERSION | tr -d '\r' | tr -d '[:space:]')"

      # ── 来源证明：tag / commit / VERSION / CI run / 资产 / version.json / latest ──
      # 正常路径和 promote_tag 恢复路径都走这里。只凭 tag 名字提升等于相信
      # 调用方；这里用 release、tag ref、git 历史、CI run、version.json 和当前
      # latest 交叉验证。历史 formal/pre-release 不会因为「曾经发过」就被当成
      # 可提升对象。
      - name: Validate promote target
        id: target
        env:
          GH_TOKEN: ${{ secrets.PIM_RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash scripts/ci/validate-promote-target.sh \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --version "$V"

      # ── 提升为正式版 ──────────────────────────────────────────────────
      - name: Promote to formal release
        id: promote
        env:
          GH_TOKEN: ${{ secrets.PIM_RELEASE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
          RELEASE_ID: ${{ steps.target.outputs.release_id }}
          VERSION: ${{ steps.target.outputs.version }}
          TAG_MACHINE_VERSION: ${{ steps.target.outputs.tag_machine_version }}
          VERSION_CODE: ${{ steps.target.outputs.version_code }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
          RUN_NUMBER: ${{ steps.target.outputs.run_number }}
          IS_PRE: ${{ steps.target.outputs.is_prerelease }}
          DISPLAY: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] \
            || { echo "::error::提升需要 REST 数字 release id（收到 '${RELEASE_ID}'）"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]+(\+[0-9A-Za-z._-]+)?$ ]] \
            || { echo "::error::version.json 机器版本非法（收到 '${VERSION}'）"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::tag commit 非法（收到 '${SHA}'）"; exit 1; }

          if [[ "$IS_PRE" == "false" ]]; then
            # 重入：上次可能已经改判成功、只是正文/latest 没跑完。不要提前退出，
            # 继续把正文/title/latest 收敛到目标状态。
            echo "::notice::${TAG} 已经是正式版，本次重入只收敛正文与 latest"
          else
            echo "提升 ${TAG}：pre-release → 正式版"
          fi

          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          {
            cat "$RUNNER_TEMP/notes.md"
            echo ""
            echo "---"
            echo ""
            echo "显示版本 / display version: \`${DISPLAY}\`"
            echo "内部版本 / internal: \`${TAG}\`"
            echo "构建运行 / build run: [${RUN_ID}](${RUN_URL})"
            echo "构建产物即本正式版的全部资产（不是二次构建）。"
          } > "$RUNNER_TEMP/final-notes.md"

          gh release edit "$TAG" --repo "$REPO" \
            --prerelease=false \
            --title "PIM Android v${DISPLAY} (${TAG})" \
            --notes-file "$RUNNER_TEMP/final-notes.md"

          # make_latest 显式设置：/releases/latest 是客户端更新检查的入口，不能靠猜。
          # 这里必须使用上面校验输出的 REST databaseId（纯数字）；`gh release view
          # --json id` 给的是 GraphQL 节点 id（RE_kwDO...），拼进 REST 路径会 404。
          gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -f make_latest=true >/dev/null

          # 不把「命令没报错」当成成功：重新读回 release 本体、全部资产和
          # /releases/latest，任何一项不收敛都失败。
          bash scripts/ci/verify-published-release.sh \
            --repo "$REPO" \
            --tag "$TAG" \
            --sha "$SHA" \
            --version "$VERSION" \
            --tag-machine-version "$TAG_MACHINE_VERSION" \
            --version-code "$VERSION_CODE" \
            --display-version "$DISPLAY" \
            --run-id "$RUN_ID" \
            --run-number "$RUN_NUMBER" \
            --expect-prerelease false \
            --expect-latest true \
            --release-id "$RELEASE_ID"

          echo "✅ 正式版：${TAG}（显示版本 v${DISPLAY}），release 与 /releases/latest 已回读确认"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Write release summary
        if: always()
        env:
          TAG: ${{ steps.target.outputs.tag }}
          V: ${{ inputs.version }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          {
            echo "### 正式版发布 v${V}"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 显示版本 | \`${V}\` |"
            echo "| 提升的 release | \`${TAG:-未产出}\` |"
            echo "| 构建 run | \`${RUN_ID:-未产出}\` |"
            echo "| 结果 | ${{ job.status }} |"
            echo ""
            echo "> 只有回读确认 release 与 /releases/latest 都指向本 tag 才算提升成功；开发期的 pre-release 不进更新检查。"
          } >> "$GITHUB_STEP_SUMMARY"
