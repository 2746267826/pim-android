name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_all:
        description: Force all builds
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      display_version: ${{ steps.ver.outputs.display_version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      artifact_slug: ${{ steps.ver.outputs.artifact_slug }}
      assembly_version: ${{ steps.ver.outputs.assembly_version }}
      git_sha_short: ${{ steps.ver.outputs.git_sha_short }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
      is_release: ${{ steps.ver.outputs.is_release }}
      # 脚本输出的每个键都透出去：少一行就是空串，而且没人会立刻发现。
      # scripts/ci/test-resolve-version.sh 会核对这张表。
      year_month: ${{ steps.ver.outputs.year_month }}
      base_version: ${{ steps.ver.outputs.base_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        uses: ./.github/actions/resolve-version
        with:
          pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}

  build-android:
    needs: [resolve-version]
    uses: ./.github/workflows/build-android.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      display_version: ${{ needs.resolve-version.outputs.display_version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
    secrets: inherit

  build-shell-android:
    needs: [resolve-version]
    uses: ./.github/workflows/build-shell-android.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      display_version: ${{ needs.resolve-version.outputs.display_version }}
      version_code: ${{ needs.resolve-version.outputs.version_code }}
      artifact_slug: ${{ needs.resolve-version.outputs.artifact_slug }}
      assembly_version: ${{ needs.resolve-version.outputs.assembly_version }}
      git_sha_short: ${{ needs.resolve-version.outputs.git_sha_short }}
    secrets: inherit

  # 契约新鲜度（只读 check + 离线行为测试）：把本仓 contract/openapi.json 与 pim-api 当前上游
  # 解析出的不可变 commit 上的同路径字节做**逐字节比较**，并校验 contract/provenance.json
  # 的存在性/形状及其与仓内快照的一致性。
  #
  # 上游契约一变、本仓没刷新 → 本 job 红；人工执行 scripts/ci/fetch-contract.sh 并提交刷新结果即恢复。
  # 取不到权威源（网络/404/空体/非 OpenAPI3）一律 fail-closed，不跳过、不降级。
  # 本仓没有 generated.ts / 没有 openapi-typescript 生成步骤，所以不安装 npm、不生成代码；
  # 入仓产物只有两个：contract/openapi.json 与 contract/provenance.json。
  #
  # 为什么是独立 job（而不是像 web 那样复用某个构建 job）：本仓的构建 job 是可复用 workflow
  # （build-android / build-shell-android），需要 Android SDK 且与契约无关；本校验只需要
  # Ubuntu + python3，独立成 job 才能被 CI Gate 逐个 check 消费而不必抬高构建成本。
  # 无 if: / continue-on-error / 路径过滤：push(master)、pull_request、workflow_dispatch 都执行。
  contract-freshness:
    name: Contract freshness
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 显式准备本设施的必要前置：python3（payload/provenance JSON 校验）与 PyYAML
      # （行为测试从真实 ci.yml 原样抽取 step/gate 体）。不依赖 runner 的预装版本。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test prerequisites (PyYAML)
        run: python3 -m pip install --disable-pip-version-check PyYAML

      # 先跑目标行为测试（离线 fixture 上游；证明一致=绿/陈旧=红/取源失败=红/旁路被拒）
      - name: Contract freshness behaviour tests
        run: |
          set -euo pipefail
          # 显示版本号读错了不影响编译，只能靠测试拦住（api 仓真漏过一次 job outputs 映射）
          bash scripts/ci/test-resolve-version.sh
          bash scripts/ci/test-validate-release-notes.sh
          bash scripts/ci/test-contract-freshness.sh

      # 发布链路守卫：这些脚本一旦漏接字段，行为上可能仍然全绿，只有真发一次版
      # 才会暴露。全部离线（stub gh / 临时 git fixture / 固定 APK 夹具），不碰真实
      # release，也不修改任何仓库。
      - name: Release guard behaviour tests
        run: |
          set -euo pipefail
          bash scripts/ci/test-release-workflow-guards.sh
          bash scripts/ci/test-release-publish-guard.sh
          bash scripts/ci/test-merge-release-pr.sh
          bash scripts/ci/test-validate-promote-target.sh
          bash scripts/ci/test-release-assets.sh

      # 契约同步（pim-api#415）：自动刷新 → 提交 → 推分支 → 开 PR 的那一步。
      # 它错了不会报错，只会"PR 开不出来"或"开出来被 pr-metadata 拦下"，
      # 所以这里必须跑（真 git fixture + stub gh，离线，不需要 npm/gradle）。
      - name: Contract sync behaviour tests
        run: |
          set -euo pipefail
          bash scripts/ci/test-contract-sync-pr.sh
          # 默认刷新链路（真 fetch-contract.sh + 真 generate-contract-kotlin.sh，
          # 本地上游 fixture）：只跑编排测试证明不了"生成物会跟着重新生成"。
          bash scripts/ci/test-contract-sync-default-refresh.sh

      # 再跑默认真实上游的只读 check（不带任何 PIM_CONTRACT_* 覆盖）
      - name: Verify client contract is up to date
        run: |
          set -euo pipefail
          bash scripts/ci/check-contract-freshness.sh
          echo "✅ 契约快照与 provenance 均与 pim-api 当前上游一致"

  # 契约生成物一致性（只读 check + 离线行为测试）：用仓内 contract/openapi.json
  # 重新生成一次 Kotlin DTO，与随提交进仓的
  # core/src/main/java/com/pim/core/contract/ContractModels.kt 做**逐字节比较**。
  #
  # 为什么必须独立成 job：契约新鲜度只证明「快照字节没落后」，不证明「客户端 DTO 跟得上契约」。
  # 契约改了、生成物没重新生成（或有人手工改了生成物）→ 本 job 红；
  # 人工执行 scripts/ci/generate-contract-kotlin.sh 并提交即恢复。
  # 生成器只用 python3 标准库：离线、确定性、不装 npm/不跑 gradle。
  #
  # 与编译期门禁 `verifyContractEndpoints`（gradle，挂在 :core/:app/:features:calendar 的
  # 编译任务之前，校验端点/路径参数/查询参数）分工：这里管「DTO 生成物与契约一致」，
  # 那里管「代码里写的端点/参数确实在契约里」。两者都进 CI Gate。
  contract-codegen:
    name: Contract codegen freshness
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyYAML 只给行为测试解析真实 ci.yml 的结构用（生成器本身只用标准库）。
      - name: Install test prerequisites (PyYAML)
        run: python3 -m pip install --disable-pip-version-check PyYAML

      # 先跑目标行为测试（离线 fixture；证明一致=绿 / 手工改动=红 / 契约变了没重生成=红 /
      # 生成物缺失=红 / 清单里编造端点=生成器拒绝 / CI 必需检查链接线正确）
      - name: Contract codegen behaviour tests
        run: |
          set -euo pipefail
          bash scripts/ci/test-contract-kotlin.sh

      # 再跑真实只读 check：重新生成到仓外临时目录，与仓内生成物逐字节比对
      - name: Verify generated Kotlin DTOs match the contract snapshot
        run: |
          set -euo pipefail
          bash scripts/ci/check-contract-kotlin.sh
          echo "✅ 生成物与 contract/openapi.json 逐字节一致"

  # 稳定通道的 connected 测试：排除 `@RequiresDevice` 标注的真机依赖用例，
  # 其余用例必须全绿 —— 这是 instrumented 门禁真正「有牙」的部分，失败即红。
  # 全量（含真机依赖）仍走 label `run-instrumented` 的报告模式通道。
  connected-android:
    name: Connected tests (stable)
    needs: [resolve-version]
    uses: ./.github/workflows/android-instrumented.yml
    with:
      mode: stable

  # 汇总门禁：任一子任务失败即整体失败，避免"看起来绿了"。
  gate:
    name: CI Gate
    needs: [resolve-version, build-android, build-shell-android, contract-freshness, contract-codegen, connected-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        env:
          R_RESOLVE: ${{ needs.resolve-version.result }}
          R_APK: ${{ needs.build-android.result }}
          R_SHELL: ${{ needs.build-shell-android.result }}
          R_FRESHNESS: ${{ needs.contract-freshness.result }}
          R_CODEGEN: ${{ needs.contract-codegen.result }}
          R_CONNECTED: ${{ needs.connected-android.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          fail=0
          check () {
            local label="$1" result="$2"
            if [ "$result" = "success" ]; then
              echo "✅ $label — success"
            else
              echo "❌ $label — ${result:-<missing>}"
              fail=1
            fi
          }
          check "resolve-version" "$R_RESOLVE"
          check "build-android" "$R_APK"
          check "build-shell-android" "$R_SHELL"
          check "contract-freshness" "$R_FRESHNESS"
          check "contract-codegen" "$R_CODEGEN"

          # connected-android 只在 PR 上是必需项：master push 时该 job 不运行
          # （PR 阶段已在同一份代码上跑过 146 个用例，没必要每次合并后再烧 20 分钟模拟器）。
          # push 下 skipped 可接受，但 failure/cancelled 仍然要红 —— 不允许"跑挂了当没跑"。
          if [ "$EVENT_NAME" = "pull_request" ]; then
            check "connected-android" "$R_CONNECTED"
          else
            case "$R_CONNECTED" in
              success|skipped)
                echo "✅ connected-android — $R_CONNECTED（$EVENT_NAME 事件不要求运行）" ;;
              *)
                echo "❌ connected-android — ${R_CONNECTED:-<missing>}（$EVENT_NAME 事件不要求运行，但非 success/skipped 仍判红）"
                fail=1 ;;
            esac
          fi

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "::error::CI Gate 未通过：存在失败或未产生结果的必需 job。"
            exit 1
          fi
          echo ""
          echo "CI Gate 通过：所有必需 job 均成功。"

  # 发版：打 tag（v2026.10.810）时发布安装包 + version.json。
  # version.json 是客户端更新检查的唯一数据源，读取用 release 的稳定直链：
  #   https://github.com/<owner>/<repo>/releases/latest/download/version.json
  # 走直链不需要 GitHub API/token，也不受 master 门禁约束（不往受保护分支提交）。
  release:
    # 合并到 master 就发版（与 pim-api 一致）。原先写成 tag 触发，但拆仓后
    # 「每次合并 = 一个版本」是既定口径，tag 由 gh release create 自动创建。
    # 构建失败时不发版；PR 时 is_release 为 false，自然跳过。
    # contract-freshness / contract-codegen 也必须在 needs 里：否则 master 上的 release 只依赖两个构建 job，
    # 会在契约快照或生成物对不上时照样发版（绕过这两道 check）。
    if: |
      always() &&
      needs.resolve-version.outputs.is_release == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: [resolve-version, build-android, build-shell-android, contract-freshness, contract-codegen]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 与 release.yml 的 apply 作业共享同一把发布锁：CI 自动发布 pre-release
    # 与人工正式版提升不能并发，否则提升刚把 release 改成 formal，旧 run 重跑
    # 又把它写回 pre-release，/releases/latest 会回退。
    concurrency:
      group: pim-release-mutation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dl

      # version.json 现在绑定 tag / commit / run / 显示版本 / versionCode，
      # 并记录两个 APK 的 sha256 + size；后续提升会重新下载资产核对。
      - name: Prepare release assets and version.json
        env:
          V: ${{ needs.resolve-version.outputs.version }}
          VC: ${{ needs.resolve-version.outputs.version_code }}
          DISPLAY: ${{ needs.resolve-version.outputs.display_version }}
          TAG: ${{ needs.resolve-version.outputs.release_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/ci/prepare-release-assets.sh \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --version "$V" \
            --version-code "$VC" \
            --display-version "$DISPLAY" \
            --sha "$SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --download-dir dl --out-dir out

      # 旧 run 可以手动重跑。重跑如果照常发布，会在正式版已经提升后把同一个
      # tag 改回 pre-release；给早已过时的 commit 补发 dev release 也一样危险。
      # 规则全部 fail-closed，且正式版绝不改写。
      - name: Guard release publication
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-version.outputs.release_tag }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bash scripts/ci/release-publish-guard.sh \
            --repo "$REPO" \
            --tag "$TAG" \
            --sha "$SHA" \
            --run-number "$RUN_NUMBER" \
            --run-attempt "$RUN_ATTEMPT" \
            --ref "$REF" \
            --event "$EVENT"

      - name: Report skipped release publication
        if: steps.existing.outputs.publish != 'true'
        env:
          TAG: ${{ needs.resolve-version.outputs.release_tag }}
          REASON: ${{ steps.existing.outputs.reason }}
          EXISTS: ${{ steps.existing.outputs.exists }}
        run: |
          {
            echo "### 发布已跳过 / Release publication skipped"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| tag | \`${TAG}\` |"
            echo "| release 已存在 | \`${EXISTS}\` |"
            echo "| 原因 | \`${REASON}\` |"
            echo ""
            echo "> 跳过不是失败：正式版不会被 CI 改写；过期 run 不会补发/刷新 release。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Release publication skipped: tag=${TAG} exists=${EXISTS} reason=${REASON}"

      - name: Publish release
        if: steps.existing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.resolve-version.outputs.version }}
          TAG: ${{ needs.resolve-version.outputs.release_tag }}
          SHA: ${{ github.sha }}
          EXISTS: ${{ steps.existing.outputs.exists }}
        run: |
          set -euo pipefail
          # 自动发布的一律是 dev 版（pre-release）。正式版由 release.yml 把「改版本号那次
          # 构建」提升上来（--prerelease=false）。GitHub 的 /releases/latest 天生跳过
          # pre-release，所以服务端的更新检查始终指向最近一个正式版，开发期不会推一堆更新。
          #
          # --target 必须是本次 commit：不传时 GitHub 会把 tag 建在默认分支的当前
          # HEAD 上，release 的 targetCommitish 就不是本次构建，提升校验会拒绝。
          if [[ "$EXISTS" == "true" ]]; then
            gh release upload "$TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PIM Android $TAG" \
              --prerelease
          else
            gh release create "$TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --title "PIM Android $TAG" \
              --generate-notes \
              --prerelease
          fi

      - name: Verify published release
        if: steps.existing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.resolve-version.outputs.version }}
          VC: ${{ needs.resolve-version.outputs.version_code }}
          DISPLAY: ${{ needs.resolve-version.outputs.display_version }}
          TAG: ${{ needs.resolve-version.outputs.release_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG_MACHINE_VERSION="$(printf '%s' "$TAG" | sed -E 's/^.*-v([0-9]{2}\.[0-9]{2}\.[0-9]+)$/\1/')"
          bash scripts/ci/verify-published-release.sh \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --sha "$SHA" \
            --version "$V" \
            --tag-machine-version "$TAG_MACHINE_VERSION" \
            --version-code "$VC" \
            --display-version "$DISPLAY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --expect-prerelease true \
            --assets-dir out

      - name: Summary
        if: always()
        env:
          TAG: ${{ needs.resolve-version.outputs.release_tag }}
          DISPLAY: ${{ needs.resolve-version.outputs.display_version }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          PUBLISH: ${{ steps.existing.outputs.publish }}
          REASON: ${{ steps.existing.outputs.reason }}
        run: |
          {
            if [[ "$PUBLISH" == "true" ]]; then
              echo "### 发版 ${TAG}"
            else
              echo "### 发版跳过 / Release skipped: ${TAG} (${REASON:-no-reason})"
            fi
            echo ""
            echo "| 资产 | 说明 |"
            echo "| --- | --- |"
            echo "| pim-android-v${VERSION}.apk | 安卓客户端 |"
            echo "| pim-shell-android-v${VERSION}.apk | 安卓壳 |"
            echo "| version.json | 更新检查数据源 |"
            echo ""
            echo "显示版本（VERSION 文件）：\`${DISPLAY}\`；机器版本：\`${VERSION}\`"
            echo ""
            echo "> 只有发布后回读 release 与资产都匹配才算成功；正式版不会由 CI 自动发布改写。"
          } >> "$GITHUB_STEP_SUMMARY"

