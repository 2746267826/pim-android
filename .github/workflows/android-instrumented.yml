name: Android Instrumented Tests

# 目的：把 `connectedDebugAndroidTest` 从开发机搬到 GitHub-hosted runner。
#
# 为什么需要它：本机（18 GB 共享主机）跑 AVD 是最大的单一内存消耗者，
# 多次把内存 + swap 一起打满、整机进入 D 状态。而这台机器还要跑生产服务。
# 公有仓的 Actions 分钟数免费，标准 ubuntu-latest runner 自带 KVM
# （2024-04 起从 larger runners 下放，需手动启用 udev 规则）。
#
# ── 两种模式（2026-11-23 引入）──────────────────────────────────────────
#
#  stable（默认，PR 必跑，由 ci.yml 调用并进 CI Gate）：排除 `@RequiresDevice`
#    标注的用例，剩余用例必须全绿 —— 这是门禁真正「有牙」的部分，失败即红。
#
#  full（label `run-instrumented` / 手动触发）：跑全部用例（含真机依赖的），
#    报告模式不阻塞。用于深度验证与真机能力回归。
#
# 为什么按注解切分而不是按包：失败根因不是某个包，而是「用例是否真的需要真实
# 麦克风/相机/输入法/mock 定位」。注解把这条判断写在用例自己身上，修好后摘掉
# 即可逐步收紧，不会因为代码移动而失配。

on:
  workflow_call:
    inputs:
      mode:
        description: 'stable (exclude @RequiresDevice, must pass) | full (all cases, report only)'
        required: false
        type: string
        default: 'stable'
  workflow_dispatch:
    inputs:
      mode:
        description: '测试模式'
        required: false
        type: choice
        options: [stable, full]
        default: stable
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode || 'label' }}
  cancel-in-progress: true

jobs:
  connected:
    name: Connected tests (API 34)
    # 关键：用「mode 有没有被显式传入」判断是否被 ci.yml 调用，不能用 event_name。
    # reusable workflow 被 `uses:` 调用时 github.event_name 继承调用方（pull_request），
    # 永远不等于 'workflow_call'；靠它判断会让 EVERY 普通 PR 都 skip，gate 必红。
    if: ${{ (inputs.mode || '') != '' || contains(github.event.pull_request.labels.*.name, 'run-instrumented') }}
    runs-on: ubuntu-latest
    # 首次运行要下载系统镜像 + 冷启动 AVD；缓存命中后通常 15-25 分钟。
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/client-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 与 build-android.yml 保持一致：runner 镜像已预置 SDK，
      # 只导出环境变量，不触发 sdkmanager "tools" 安装（cmdline-tools 16+ 已移除该包）。
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages (if missing)
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36.1" ]; then
            sdkmanager "platforms;android-36.1" "build-tools;36.1.0"
          fi

      # 标准 runner 上 /dev/kvm 存在，但 runner 用户不在 kvm 组，
      # 且 job 内 usermod 不生效 —— 必须靠 udev 规则放权限，否则模拟器退化成软件渲染（慢 10-20 倍）。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: gradle/actions/setup-gradle@v3

      # AVD 快照缓存：系统镜像下载 + 冷启动是最贵的两步，缓存命中后可省数分钟。
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api34-x86_64-google_apis

      # 缓存未命中时先冷启动一次并保存快照，后续运行从快照启动。
      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD snapshot generated for caching."

      # ---------- stable：排除真机依赖用例，必须全绿（门禁有牙的部分）----------
      - name: Run stable connected tests (must pass)
        id: stable
        # 标签触发的是 full 模式，这里必须让位；否则标签 PR 会同时跑两遍。
        if: ${{ inputs.mode != 'full' && !contains(github.event.pull_request.labels.*.name, 'run-instrumented') }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: src/client-android
          # --no-daemon：CI 上常驻 Gradle daemon 只会占内存。
          script: >-
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
            -Pandroid.testInstrumentationRunnerArguments.notAnnotation=com.pim.app.RequiresDevice

      # ---------- full：跑全部用例，报告模式（不阻塞）----------
      - name: Run full connected tests (report only)
        id: full
        if: ${{ inputs.mode == 'full' || contains(github.event.pull_request.labels.*.name, 'run-instrumented') }}
        # 其中约 26 个用例依赖真实录音/相机/输入法/mock 定位，模拟器上必然失败。
        # 本通道用于真机能力回归，失败不阻塞，报告照常产出。
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: src/client-android
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Summarize instrumented results
        if: always()
        run: |
          set -uo pipefail
          MODE="${{ inputs.mode || 'full (label)' }}"
          {
            echo "### Connected (instrumented) — 模式：${MODE}"
            echo ""
            echo "| 通道 | 结果 |"
            echo "| --- | --- |"
            echo "| stable（排除 @RequiresDevice，必须绿） | \`${{ steps.stable.outcome }}\` |"
            echo "| full（全部用例，报告模式） | \`${{ steps.full.outcome }}\` |"
            echo ""
            echo "完整报告见 \`instrumented-test-reports-*\` artifact。"
            if [ "$MODE" = "stable" ] && [ "${{ steps.stable.outcome }}" = "failure" ]; then
              echo ""
              echo "> ❌ stable 通道失败：这就是门禁要拦住的信号。修好它，或标注 \`@RequiresDevice\` 并在 PR 里写明理由。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-${{ github.run_id }}
          path: |
            src/client-android/app/build/reports/androidTests/
            src/client-android/app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: warn
