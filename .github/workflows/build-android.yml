name: Build Android APK

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      version_code:
        required: true
        type: string
      artifact_slug:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      git_sha_short:
        required: true
        type: string
      # true = 正式发布构建（master push），必须产出已签名且验签通过的 APK；
      # false = fork / 普通 PR，允许未签名构建，仅用于代码验证。
      require_signing:
        description: 'Require a signed, verified release APK (true only for a real release build)'
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version (empty = resolve locally for debug)'
        required: false
        default: ''
      version_code:
        required: false
        default: ''
      artifact_slug:
        required: false
        default: ''
      assembly_version:
        required: false
        default: ''
      git_sha_short:
        required: false
        default: ''
      require_signing:
        description: 'Require a signed, verified release APK (leave false for code-only builds)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client-android

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version if needed
        id: ver
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "artifact_slug=${{ inputs.artifact_slug }}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${{ inputs.assembly_version }}" >> "$GITHUB_OUTPUT"
            echo "git_sha_short=${{ inputs.git_sha_short }}" >> "$GITHUB_OUTPUT"
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/resolve-version.sh"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # setup-android@v3 会执行 `sdkmanager "tools"`，该包在 cmdline-tools 16+
      # 已被移除，导致 job 在编译前就失败。runner 镜像已预置 SDK，这里只做
      # 环境变量导出，不再触发自动安装。
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages (if missing)
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36.1" ]; then
            sdkmanager "platforms;android-36.1" "build-tools;36.1.0"
          fi

      - uses: gradle/actions/setup-gradle@v3

      - name: Set CI version env
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          echo "CI_APP_VERSION=${{ steps.ver.outputs.version }}" >> "$GITHUB_ENV"
          echo "CI_VERSION_CODE=${{ steps.ver.outputs.version_code }}" >> "$GITHUB_ENV"
          echo "VERSION_FILE=${{ steps.ver.outputs.artifact_slug }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ steps.ver.outputs.version_code }}" >> "$GITHUB_ENV"

      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PIM_IS_RELEASE: ${{ inputs.require_signing }}
        run: |
          # 正式发布构建必须有签名密钥：缺失即失败关闭，绝不让未签名包成为正式资产（F-A-04）。
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            if [ "${PIM_IS_RELEASE:-false}" = "true" ]; then
              echo "::error::正式发布构建（require_signing=true）必须配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD。"
              exit 1
            fi
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set —— 非发布构建，以未签名方式继续（仅验证代码）。"
            exit 0
          fi
          SIGNING_DIR="$RUNNER_TEMP/android-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n[:space:]' | base64 --decode > "$SIGNING_DIR/pim-ci-upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$SIGNING_DIR/pim-ci-upload.jks" >> "$GITHUB_ENV"

      - name: Generate gradlew wrapper
        run: |
          # Generate wrapper from temp dir (with minimal settings.gradle to placate Gradle 9)
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          touch settings.gradle
          gradle wrapper --gradle-version 8.14
          # Copy wrapper files into the project
          cp gradlew gradlew.bat "$OLDPWD/"
          mkdir -p "$OLDPWD/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$OLDPWD/gradle/wrapper/"
          chmod +x "$OLDPWD/gradlew"
          rm -rf "$TMPDIR"

      - name: Unit tests & build release (parallel)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PIM_IS_RELEASE: ${{ inputs.require_signing }}
        run: |
          # 只有密钥文件存在时才要求配套的密码/别名，避免 gradle 拿到半个配置。
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error::$name is not set."
                exit 1
              fi
            done
          elif [ "${PIM_IS_RELEASE:-false}" = "true" ]; then
            echo "::error::正式发布构建（require_signing=true）缺少签名密钥文件（ANDROID_KEYSTORE_BASE64 未配置或解码失败）。"
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_FILE 未设置 —— 非发布构建，以未签名方式继续（仅验证代码）。"
            unset ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          fi
          # F-A-02：:core 的测试（鉴权/刷新/契约）必须与 :app 同等进 CI，不能只跑 :app。
          ./gradlew :app:testDebugUnitTest :core:testDebugUnitTest --no-daemon &
          PID1=$!
          ./gradlew assembleRelease --no-daemon &
          PID2=$!
          STATUS=0
          wait $PID1 || STATUS=$?
          wait $PID2 || STATUS=$?
          exit $STATUS

      - name: Stage APK
        env:
          PIM_IS_RELEASE: ${{ inputs.require_signing }}
        run: |
          mkdir -p build/artifacts
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ "${PIM_IS_RELEASE:-false}" = "true" ]; then
            # 正式发布必须使用已签名产物；回退到 unsigned 会以正式资产名发布未签名包（F-A-04）。
            if [ ! -f "$SIGNED" ]; then
              echo "::error::正式发布构建必须产出已签名 APK，实际找不到 $SIGNED（未签名包不得作为正式资产）。"
              exit 1
            fi
            SRC="$SIGNED"
          else
            SRC="$SIGNED"
            if [ ! -f "$SRC" ]; then
              SRC="$UNSIGNED"
            fi
          fi
          cp "$SRC" \
            "build/artifacts/pim-android-v${{ steps.ver.outputs.artifact_slug }}-vc${{ steps.ver.outputs.version_code }}.apk"

      - name: Log signing cert fingerprint
        working-directory: src/client-android
        shell: bash
        env:
          PIM_IS_RELEASE: ${{ inputs.require_signing }}
        run: |
          # 非发布构建（fork / 普通 PR）不强制验签，保留未签名代码验证能力。
          if [ "${PIM_IS_RELEASE:-false}" != "true" ]; then
            echo "::notice::非发布构建，跳过验签强制（未签名包仅用于代码验证）。"
            exit 0
          fi
          APK=$(ls build/artifacts/*.apk | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -n1)
          if [ -z "$BT" ]; then
            echo "::error::正式发布构建找不到 build-tools，无法验签。"
            exit 1
          fi
          # shell: bash ⇒ `-o pipefail`：apksigner 失败不再被 `| tee` 吞掉（F-A-04 / C-1）。
          "${BT}apksigner" verify --print-certs "$APK" | tee build/artifacts/signing-certs.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: pim-android-v${{ steps.ver.outputs.artifact_slug }}-vc${{ steps.ver.outputs.version_code }}
          path: src/client-android/build/artifacts/*
